<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="Contribution Streak">
<title>Contribution Streak</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#0f3460"/>
  </linearGradient>
</defs>
<style>
  text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; }
  .t { font-size: 18px; font-weight: 600; fill: #00b4d8; }
  .l { font-size: 14px; fill: #c9d1d9; }
  .v { font-size: 14px; font-weight: 700; fill: #c9d1d9; }
  .m { font-size: 12px; fill: #8b949e; }
  .big { font-size: 28px; font-weight: 700; fill: #c9d1d9; }
  .fade { opacity: 0; animation: in .5s ease-out forwards; }
  @keyframes in { to { opacity: 1; } }
</style>
<rect width="495" height="195" rx="10" fill="url(#bg)"/>
<text x="25" y="38" class="t">Contribution Streak</text>

<line x1="165" y1="60" x2="165" y2="170" stroke="#21262d"/>
<line x1="330" y1="60" x2="330" y2="170" stroke="#21262d"/>
<g class="fade" style="animation-delay:150ms">
  <text x="82" y="110" text-anchor="middle" class="big">298</text>
  <text x="82" y="138" text-anchor="middle" class="l">Total Contributions</text>
  <text x="82" y="160" text-anchor="middle" class="m">Jul 5, 2021 - Present</text>
</g>
<g class="fade" style="animation-delay:300ms">
  <circle cx="248" cy="98" r="36" fill="none" stroke="#00b4d8" stroke-width="5"/>
  <g transform="translate(240,52)"><circle cx="8" cy="8" r="11" fill="#0d1117"/><path transform="translate(0,0)" fill="#00b4d8" d="M9.533.753V.752c.217 2.385 1.463 3.626 2.653 4.81C13.37 6.74 14.498 7.863 14.498 10c0 3.5-3 6-6.5 6S1.5 13.512 1.5 10c0-1.298.536-2.56 1.425-3.286.376-.308.862 0 1.035.454C4.46 8.487 5.581 8.419 6 8c.282-.282.341-.811-.003-1.5C4.34 3.187 7.035.75 8.77.146c.39-.137.726.194.763.607Z"/></g>
  <text x="248" y="108" text-anchor="middle" class="big">0</text>
  <text x="248" y="155" text-anchor="middle" class="v" style="fill:#00b4d8">Current Streak</text>
  <text x="248" y="175" text-anchor="middle" class="m">Start a new streak</text>
</g>
<g class="fade" style="animation-delay:450ms">
  <text x="412" y="110" text-anchor="middle" class="big">5</text>
  <text x="412" y="138" text-anchor="middle" class="l">Longest Streak</text>
  <text x="412" y="160" text-anchor="middle" class="m">Oct 23 - Oct 27, 2026</text>
</g>
</svg>
